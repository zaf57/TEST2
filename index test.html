<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste Machines Atelier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .machine {
            background: white;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-size: 16px;
        }

        
    </style>
</head>
<body>

    <h1>Liste Machines</h1>

    <div class="grid" id="machines"></div>

    <script>

        const lettres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

        const container = document.getElementById('machines');

        lettres.forEach((lettre, index) => {

            const rangee = index + 1;

            for(let i = 1; i <= 9; i++) {

                ['G', 'D'].forEach(cote => {

                    const code = `CU${lettre}${i}${cote}`;
                    const alias = `${rangee}/${i}${cote}`;

                    const div = document.createElement('div');
                    div.className = 'machine';

                    div.innerHTML = `${code}`;

                    container.appendChild(div);
                });
            }
        });

    </script>

</body>
</html>
